plugins {
    id 'application'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '4.0.2'
}

group = 'io.github.ahojukka5'
version = '2.0.0-SNAPSHOT'

description = 'A polished modern JavaFX Tic-Tac-Toe game.'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

javafx {
    version = '21.0.10'
    modules = ['javafx.controls']
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainModule = 'io.github.ahojukka5.jatictactoe'
    mainClass = 'tictactoe.App'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jlink {
    options = ['--strip-debug', '--compress=zip-6', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'JaTicTacToe'
    }
    jpackage {
        imageName = 'JaTicTacToe'
        installerName = 'JaTicTacToe'
        appVersion = '2.0.0'
        vendor = 'Jukka Aho'
    }
}
